[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hugo-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",

    # Cache / pub-sub
    "redis[hiredis]>=5.0.3",

    # Validation
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.1",

    # LLM
    "anthropic>=0.25.0",

    # Embeddings
    "voyageai>=0.2.3",

    # Logging
    "structlog>=24.1.0",

    # Sessions
    "itsdangerous>=2.1.2",

    # Password hashing
    "bcrypt>=4.0.0",

    # HTTP client (used by voyage)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
